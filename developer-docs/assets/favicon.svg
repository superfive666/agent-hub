<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="agent-hub">
  <title>agent-hub</title>
  <defs>
    <linearGradient id="ah-core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf3ff"/>
      <stop offset=".45" stop-color="#a06bff"/>
      <stop offset="1" stop-color="#ff5cc8"/>
    </linearGradient>
    <linearGradient id="ah-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#41e0ff"/>
      <stop offset=".33" stop-color="#a06bff"/>
      <stop offset=".66" stop-color="#ff5cc8"/>
      <stop offset="1" stop-color="#3ee0c8"/>
    </linearGradient>
    <radialGradient id="ah-neb" cx=".22" cy=".14" r=".9">
      <stop offset="0" stop-color="#6a3cff" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#0d1b3a" stop-opacity=".35"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ah-neb2" cx=".84" cy=".92" r=".8">
      <stop offset="0" stop-color="#00d8c0" stop-opacity=".42"/>
      <stop offset="1" stop-color="#05060a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ah-halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b98cff" stop-opacity=".85"/>
      <stop offset="1" stop-color="#b98cff" stop-opacity="0"/>
    </radialGradient>
    <!-- 辐条渐变必须用 userSpaceOnUse：默认的 objectBoundingBox 对**竖直线段**
         算出来的包围盒宽度是 0，按规范这种元素直接不画 —— 症状是那一根辐条凭空消失，
         另外两根斜的却好好的，很容易看成「设计如此」。 -->
    <linearGradient id="ah-sp1" gradientUnits="userSpaceOnUse" x1="32" y1="32" x2="32" y2="11">
      <stop offset="0" stop-color="#a06bff"/><stop offset="1" stop-color="#41e0ff"/>
    </linearGradient>
    <linearGradient id="ah-sp2" gradientUnits="userSpaceOnUse" x1="32" y1="32" x2="50.2" y2="42.5">
      <stop offset="0" stop-color="#a06bff"/><stop offset="1" stop-color="#ff5cc8"/>
    </linearGradient>
    <linearGradient id="ah-sp3" gradientUnits="userSpaceOnUse" x1="32" y1="32" x2="13.8" y2="42.5">
      <stop offset="0" stop-color="#a06bff"/><stop offset="1" stop-color="#3ee0c8"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#05060a"/>
  <rect width="64" height="64" rx="14" fill="url(#ah-neb)"/>
  <rect width="64" height="64" rx="14" fill="url(#ah-neb2)"/>

  <circle cx="32" cy="32" r="21" fill="none" stroke="url(#ah-ring)" stroke-width="1.5" opacity=".45"/>
  <circle cx="32" cy="32" r="17" fill="url(#ah-halo)" opacity=".5"/>

  <g stroke-linecap="round" stroke-width="3.2">
    <path d="M32 32 32 11" stroke="url(#ah-sp1)"/>
    <path d="M32 32 50.2 42.5" stroke="url(#ah-sp2)"/>
    <path d="M32 32 13.8 42.5" stroke="url(#ah-sp3)"/>
  </g>

  <circle cx="32" cy="11" r="5.4" fill="#41e0ff"/>
  <circle cx="50.2" cy="42.5" r="5.4" fill="#ff5cc8"/>
  <circle cx="13.8" cy="42.5" r="5.4" fill="#3ee0c8"/>

  <circle cx="32" cy="32" r="9.6" fill="url(#ah-core)"/>
  <circle cx="29.2" cy="29" r="2.6" fill="#fff" opacity=".8"/>
</svg>
