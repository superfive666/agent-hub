name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go 测试与静态检查
    runs-on: ubuntu-latest
    services:
      postgres:
        # 数据库相关的行为必须用真 PostgreSQL 测：SKIP LOCKED、advisory lock、
        # 事务隔离的行为 mock 不出来，而它们正是 outbox 方案的地基。
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agenthub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/agenthub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化："; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@v6
        with: { version: latest }

      - name: 建表
        run: psql "$TEST_DATABASE_URL" -f docs/schema/001_init.sql

      - name: 单元测试
        # -race 不是可选项：这个项目里到处是并发（worker 认领、连接顶替、并发租约）
        run: go test ./... -race -covermode=atomic -coverprofile=coverage.out

      - name: 领域层覆盖率门槛
        run: |
          pct=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/,"",$3); print $3}')
          echo "总覆盖率 ${pct}%"
          awk -v p="$pct" 'BEGIN { if (p+0 < 85) { print "低于 85% 门槛"; exit 1 } }'

  openapi:
    name: API 契约校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npx --yes @redocly/cli@latest lint docs/api/openapi.yaml

  schema:
    name: Schema 可执行性
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: schema_check }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: 逐个执行迁移
        run: |
          for f in docs/schema/*.sql; do
            echo "==> $f"
            psql "postgres://postgres:postgres@localhost:5432/schema_check?sslmode=disable" \
              -v ON_ERROR_STOP=1 -f "$f"
          done
