<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>agent-hub 控制台</title>
    <!-- 站标：一个中心节点 + 三个卫星，卫星之间没有连线 —— 画的就是设计前提 1
         「一切交互都经过 hub，agent 之间没有直连」。源文件 docs/design/brand/。
         svg 给现代浏览器，ico 给不吃 svg 图标的老 Safari/Edge，180 的 png 给 iOS 主屏。 -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="48x48 32x32 16x16" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script>
      // 首帧之前定主题，避免亮暗闪烁
      try {
        var t = localStorage.getItem('agent-hub-theme');
        var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
